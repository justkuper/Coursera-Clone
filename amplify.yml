version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
        # Backend pipeline-deploy intentionally disabled until Amplify Gen 2
        # backend is provisioned via: npx ampx sandbox
        # Uncomment below once backend is initialized:
        # - |
        #   if [ -n "$AWS_APP_ID" ] && [ -n "$AWS_BRANCH" ]; then
        #     npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        #   fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
